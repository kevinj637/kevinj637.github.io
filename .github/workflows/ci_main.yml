# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Explicitly grant write permissions for this workflow
permissions: 
  pages: write
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

      #Set up node on built frame
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build. optimize-images re-compresses/downscales the tracked raster
      # images at the REPO ROOT public/ in place (that's what actually gets
      # deployed). It's hash-idempotent via the manifest at
      # kevin_react/src/json/.image-optim.json: images already recorded there
      # are skipped, so this only does work for images added/changed since the
      # last local optimize+commit. The optimized bytes are baked into the
      # uploaded artifact below; CI does not push anything back to the repo.
      - name: Install dependencies, optimize images, build, move dist to root
        working-directory: ./kevin_react
        run: |
          npm install
          npm run optimize-images
          npm run build

      # Publish the fresh build to the repo root. Remove the PREVIOUS build's
      # output first. Stale and mismatched assets lead to app failing to mount correctly.
      # Clearing first guarantees the deployed index.html and assets/ are always internally consistent.
      - name: Publish build to repo root (clean)
        run: |
          rm -rf assets index.html
          cp -r kevin_react/dist/* .

      # Upload and deploy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
      
