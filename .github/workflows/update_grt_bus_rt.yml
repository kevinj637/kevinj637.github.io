name: Update GRT data

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes, offset from the top of the hour.
    # GitHub Actions cron uses UTC.
    - cron: "7-59/10 * * * *"

permissions:
  contents: write

jobs:
  update-grt-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch GRT data
        run: npm run fetch:grt

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/vehicles.json

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update GRT vehicle data"
            git push
          fi